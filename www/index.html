var UPS=[{n:"Aether Amplify",d:"+18% damage",i:"⚡",f:function(){P.dmgM*=1.18;P.pl=Math.floor(P.pl*1.1);}},{n:"Rapid Surge",d:"+15% fire rate",i:"🔥",f:function(){P.blast.rate*=0.85;P.pl=Math.floor(P.pl*1.07);}},{n:"Split Blast",d:"+1 projectile",i:"✦",f:function(){P.blast.cnt=Math.min(P.blast.cnt+1,6);P.pl=Math.floor(P.pl*1.14);}},{n:"Swift Step",d:"+12% move speed",i:"💨",f:function(){P.spdM*=1.12;P.pl=Math.floor(P.pl*1.05);}},{n:"Core Harden",d:"+25 max HP + heal",i:"♥",f:function(){P.maxHp+=25;P.hp=Math.min(P.hp+35,P.maxHp);P.pl=Math.floor(P.pl*1.06);}},{n:"Orbiting Orbs",d:"Unlock / boost orbs",i:"◎",f:function(){if(!P.orbit.on)P.orbit.on=true;else{P.orbit.cnt=Math.min(P.orbit.cnt+1,5);P.orbit.dmg+=3;}P.pl=Math.floor(P.pl*1.12);}},{n:"Shock Wave",d:"Unlock / boost wave",i:"💥",f:function(){if(!P.wave.on)P.wave.on=true;else P.wave.dmg+=8;P.pl=Math.floor(P.pl*1.11);}},{n:"Extended Reach",d:"+20% range",i:"↗",f:function(){P.blast.rng*=1.2;P.pl=Math.floor(P.pl*1.04);}},{n:"Magnet Pull",d:"Wider XP collect",i:"🧲",f:function(){P.pick*=1.3;}},{n:"Piercing Rounds",d:"Shots pierce +1 enemy",i:"➹",f:function(){P.blast.pierce+=1;P.pl=Math.floor(P.pl*1.09);}},{n:"Vampiric Core",d:"+6% lifesteal",i:"🩸",f:function(){P.lifesteal+=0.06;P.pl=Math.floor(P.pl*1.08);}},{n:"Critical Focus",d:"+15% crit chance (2x dmg)",i:"✧",f:function(){P.critChance=Math.min(0.75,P.critChance+0.15);P.pl=Math.floor(P.pl*1.09);}},{n:"Second Wind",d:"Survive a killing blow once",i:"🕊",f:function(){P.extraLife=true;P.pl=Math.floor(P.pl*1.1);}},{n:"AETHER ASCENSION",d:"Transform — gold form",i:"🌟",f:function(){startAsc();}}];

function startAsc(){if(P.form===1){P.formT=P.formMax;P.pl=Math.floor(P.pl*1.2);cam.sh=0.4;sfxTransform();return;}P.chargeT=1.0;P.inv=1.2;cam.sh=0.3;sfxTransform();}
function finishAsc(){haptic("HEAVY");P.form=1;P.formT=P.formMax;P.dmgM*=1.45;P.spdM*=1.2;P.pl=Math.floor(P.pl*1.7);P.inv=0.7;cam.sh=0.55;for(var i=0;i<35;i++){var a=Math.random()*Math.PI*2,s=1.5+Math.random()*5;addP(P.x,P.y,{vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.5+Math.random()*0.4,sz:2.5+Math.random()*3,c:i%2?"#fff":"#ffe040"});}}

function showLvl(){state="levelup";sfxLvl();haptic("MEDIUM");var g=document.getElementById("ug");g.innerHTML="";var pool=UPS.slice(),picks=[];if(P.lv>=3&&Math.random()<0.5){picks.push(UPS[UPS.length-1]);pool=pool.slice(0,-1);}while(picks.length<3&&pool.length){var i=Math.floor(Math.random()*pool.length);picks.push(pool.splice(i,1)[0]);}picks.forEach(function(u){var c=document.createElement("div");c.className="uc";c.innerHTML='<div class="ui">'+u.i+'</div><div class="uf"><h3>'+u.n+'</h3><p>'+u.d+'</p></div>';c.onclick=function(){u.f();document.getElementById("lvlUp").style.display="none";state="playing";hud();};g.appendChild(c);});document.getElementById("lvlUp").style.display="flex";}

function resetP(){P.x=0;P.y=0;P.hp=P.maxHp=100;P.xp=0;P.lv=1;P.xpN=26;P.pl=1200;P.inv=0;P.dmgM=1;P.spdM=1;P.pick=1;P.form=0;P.formT=0;P.chargeT=0;P.frame=0;P.runT=0;P.facing=1;P.atkT=0;P.lifesteal=0;P.critChance=0;P.critMult=2;P.extraLife=false;P.blast={dmg:12,rate:0.4,t:0,cnt:1,rng:290,pierce:0};P.orbit={on:false,dmg:8,cnt:2,rad:50,ang:0,spd:2.5};P.wave={on:false,dmg:18,rate:1.6,t:0};}

function dmgE(e,dmg,hx,hy){if(e.armor)dmg*=(1-e.armor);var crit=false;if(P.critChance&&Math.random()<P.critChance){dmg*=P.critMult||2;crit=true;}e.hp-=dmg;e.fl=0.1;sfxHit();if(P.lifesteal)P.hp=Math.min(P.maxHp,P.hp+dmg*P.lifesteal);addP(hx,hy,{life:0.18,sz:crit?3:2,c:crit?"#ff6ae0":"#ffee77"});ftxt.push({x:e.x,y:e.y-14,t:(crit?"CRIT ":"")+Math.floor(dmg),life:0.45,c:crit?"#ff6ae0":"#ffee66"});if(e.hp<=0){sfxDeath();boom(e.x,e.y,e.c,e.el?12:7);orbs.push({x:e.x,y:e.y,v:e.xp});if(e.el)orbs.push({x:e.x+(Math.random()-0.5)*12,y:e.y+(Math.random()-0.5)*12,v:Math.ceil(e.xp*0.4)});if(e.splits>0){for(var s=0;s<2;s++){var sa=Math.random()*Math.PI*2;enemies.push({x:e.x+Math.cos(sa)*14,y:e.y+Math.sin(sa)*14,hp:e.max*0.42,max:e.max*0.42,spd:e.spd*1.15,r:e.r*0.65,c:e.c,d:Math.max(3,e.d*0.6),xp:Math.ceil(e.xp*0.5),rng:false,el:false,type:e.type,armor:0,splits:0,n:e.n,shT:1,ang:0,fl:0,frame:0,runT:0});}}if(e.boss){P.pl=Math.floor(P.pl*1.3)+150;for(var s2=0;s2<4;s2++)orbs.push({x:e.x+(Math.random()-0.5)*24,y:e.y+(Math.random()-0.5)*24,v:Math.ceil(e.xp*0.3)});boom(e.x,e.y,"#ffe040",22);cam.sh=0.6;bossAlive=false;}kills++;cam.sh=Math.min(0.35,cam.sh+0.07);var i=enemies.indexOf(e);if(i>=0)enemies.splice(i,1);}}
function checkDeath(){if(P.hp<=0){if(P.extraLife){P.extraLife=false;P.hp=Math.floor(P.maxHp*0.4);P.inv=1.5;haptic("HEAVY");boom(P.x,P.y,"#8affc0",16);cam.sh=0.4;}else{P.hp=0;gameOver();}}}
function update(dt){if(state!=="playing")return;gT+=dt;sT-=dt;if(sT<=0){stageClear();return;}
if(P.chargeT>0){P.chargeT-=dt;if(Math.random()<0.5)addP(P.x+(Math.random()-0.5)*14,P.y+6,{vx:(Math.random()-0.5),vy:-2.5-Math.random()*3,life:0.4,sz:2,c:"#ffe080"});if(P.chargeT<=0)finishAsc();}
if(P.form===1){P.formT-=dt;if(P.formT<=0){P.form=0;P.dmgM/=1.45;P.spdM/=1.2;}}
var spd=P.spd*P.spdM;P.x+=joy.x*spd*dt;P.y+=joy.y*spd*dt;if(joy.x||joy.y){P.ang=Math.atan2(joy.y,joy.x);P.facing=joy.x>=0?1:-1;P.runT+=dt*11;}else P.runT*=0.9;P.frame+=dt*7.5;if(P.inv>0)P.inv-=dt;if(P.atkT>0)P.atkT-=dt;
cam.x+=(P.x-cam.x)*Math.min(1,6.5*dt);cam.y+=(P.y-cam.y)*Math.min(1,6.5*dt);if(cam.sh>0)cam.sh=Math.max(0,cam.sh-dt*6.5);
var b=P.blast;b.t-=dt;if(b.t<=0){var near=null,nd=b.rng;for(var i=0;i<enemies.length;i++){var e=enemies[i],d=Math.hypot(e.x-P.x,e.y-P.y);if(d<nd){nd=d;near=e;}}if(near){var base=Math.atan2(near.y-P.y,near.x-P.x),cnt=b.cnt,spr=Math.min(0.32,0.09*(cnt-1));var col=P.form===1?"#ffe040":"#7ae0ff";for(var j=0;j<cnt;j++){var a=base+(j-(cnt-1)/2)*spr;spawnPr(P.x,P.y,a,b.dmg*P.dmgM,500,0.55,col,4,true,b.pierce);}sfxShoot();P.atkT=0.15;}b.t=b.rate;}
if(P.orbit.on){var o=P.orbit;o.ang+=o.spd*dt;for(var i=0;i<o.cnt;i++){var a=o.ang+(i/o.cnt)*Math.PI*2,ox=P.x+Math.cos(a)*o.rad,oy=P.y+Math.sin(a)*o.rad;for(var j=enemies.length-1;j>=0;j--){var e=enemies[j];if(Math.hypot(e.x-ox,e.y-oy)<e.r+7)dmgE(e,o.dmg*P.dmgM,ox,oy);}}}
if(P.wave.on){P.wave.t-=dt;if(P.wave.t<=0){P.wave.t=P.wave.rate;var col=P.form===1?"#ffcc30":"#ffb040";for(var i=0;i<10;i++){var a=(i/10)*Math.PI*2;spawnPr(P.x,P.y,a,P.wave.dmg*P.dmgM,320,0.32,col,5,true);}boom(P.x,P.y,col,8);cam.sh=0.15;}}
for(var i=projs.length-1;i>=0;i--){var p=projs[i];p.trail.push({x:p.x,y:p.y});if(p.trail.length>3)p.trail.shift();p.x+=Math.cos(p.a)*p.spd*dt;p.y+=Math.sin(p.a)*p.spd*dt;p.life-=dt;if(p.life<=0){projs.splice(i,1);continue;}if(p.fp){for(var j=enemies.length-1;j>=0;j--){var e=enemies[j];if(p.hit.indexOf(e)>=0)continue;if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r){dmgE(e,p.dmg,p.x,p.y);if(p.pierce>0){p.pierce--;p.hit.push(e);}else{projs.splice(i,1);}break;}}}else{if(P.inv<=0&&Math.hypot(P.x-p.x,P.y-p.y)<P.r+p.r){P.hp-=p.dmg;P.inv=0.45;sfxHurt();cam.sh=0.22;boom(P.x,P.y,"#ff5577",4);projs.splice(i,1);checkDeath();}}}
for(var i=enemies.length-1;i>=0;i--){var e=enemies[i],dx=P.x-e.x,dy=P.y-e.y,dist=Math.hypot(dx,dy)||1;e.ang=Math.atan2(dy,dx);e.frame+=dt*5;e.runT+=dt*7;if(e.rng&&dist<250){e.shT-=dt;if(e.shT<=0){e.shT=1.6+Math.random()*0.4;spawnPr(e.x,e.y,e.ang,7,220,1.1,"#ff60b0",4,false);}if(dist<150){e.x-=(dx/dist)*e.spd*0.45*dt;e.y-=(dy/dist)*e.spd*0.45*dt;}else{e.x+=(dx/dist)*e.spd*0.28*dt;e.y+=(dy/dist)*e.spd*0.28*dt;}}else{e.x+=(dx/dist)*e.spd*dt;e.y+=(dy/dist)*e.spd*dt;}if(e.fl>0)e.fl-=dt;if(P.inv<=0&&dist<P.r+e.r-1){P.hp-=e.d;P.inv=0.5;sfxHurt();cam.sh=0.28;boom(P.x,P.y,"#ff4060",5);e.x-=(dx/dist)*22;e.y-=(dy/dist)*22;checkDeath();}}
var sd=STAGES[Math.min(stage-1,STAGES.length-1)]||STAGES[0];var rate=Math.max(0.2,0.9-gT*0.006)/sd.m;spT-=dt;if(spT<=0){var n=1+Math.floor(gT/45);for(var k=0;k<n;k++)spawnE();spT=rate;}
if(!bossSpawned&&stage<=BOSSES.length&&sT<=BOSS_WINDOW){bossSpawned=true;spawnBoss();}
var pr=44*P.pick;for(var i=orbs.length-1;i>=0;i--){var o=orbs[i],dx=P.x-o.x,dy=P.y-o.y,d=Math.hypot(dx,dy);if(d<pr){o.x+=dx*8*dt;o.y+=dy*8*dt;}if(d<P.r+5){P.xp+=o.v;orbs.splice(i,1);if(P.xp>=P.xpN){P.xp-=P.xpN;P.lv++;P.xpN=Math.floor(26*Math.pow(1.27,P.lv-1));P.pl=Math.floor(P.pl*1.06+50);showLvl();}}}
for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=0.92;p.vy*=0.92;p.life-=dt;if(p.life<=0)parts.splice(i,1);}
for(var i=ftxt.length-1;i>=0;i--){ftxt[i].life-=dt;ftxt[i].y-=28*dt;if(ftxt[i].life<=0)ftxt.splice(i,1);}
hud();}
function hud(){document.getElementById("hpF").style.width=Math.max(0,P.hp/P.maxHp*100)+"%";document.getElementById("hpT").textContent=Math.ceil(P.hp);document.getElementById("xpF").style.width=(P.xp/P.xpN*100)+"%";document.getElementById("xpT").textContent="LV "+P.lv;document.getElementById("pl").textContent="PL "+P.pl.toLocaleString()+(P.form===1?" ★":"");var m=Math.floor(sT/60),s=Math.floor(sT%60);document.getElementById("tm").textContent=m+":"+(s<10?"0":"")+s;var sn=STAGES[Math.min(stage-1,STAGES.length-1)];document.getElementById("st").textContent=bossAlive?("⚠ "+bossName):"Stage "+stage+" — "+(sn?sn.n:"Endless");}

function drawLandscape(ox,oy,theme){var gcol=["#1a2438","#0e2218","#1c1230","#2a1018","#16283a","#241238"][theme]||"#1a2438";ctx.fillStyle=gcol;ctx.fillRect(0,H*0.55,W,H*0.45);if(theme===0){ctx.fillStyle="#152030";for(var i=-1;i<6;i++){var bx=((i*160+ox*0.25)%(W+180))-80;ctx.beginPath();ctx.moveTo(bx,H*0.55);ctx.lineTo(bx+35,H*0.43);ctx.lineTo(bx+80,H*0.48);ctx.lineTo(bx+120,H*0.4);ctx.lineTo(bx+160,H*0.55);ctx.fill();}}else if(theme===1){ctx.fillStyle="#0a1c12";for(var i=-1;i<7;i++){var tx=((i*100+ox*0.2)%(W+130))-50;ctx.fillRect(tx-3,H*0.42,6,H*0.18);ctx.beginPath();ctx.arc(tx,H*0.4,22+i%6,0,Math.PI*2);ctx.fill();}}else if(theme===2){ctx.fillStyle="#2a1848";for(var i=0;i<10;i++){var cx=((i*80+ox*0.3)%(W+70))-30,cy=H*0.53+((i*37)%40),h=16+(i%4)*6;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx-6,cy-h);ctx.lineTo(cx+6,cy-h);ctx.closePath();ctx.fill();}}else if(theme===3){ctx.fillStyle="#301018";for(var i=-1;i<5;i++){var px=((i*140+ox*0.15)%(W+160))-70;ctx.fillRect(px,H*0.38,24+i%12,H*0.22);}}else if(theme===4){ctx.fillStyle="#1a3550";for(var i=-1;i<8;i++){var ix=((i*90+ox*0.22)%(W+110))-40;ctx.beginPath();ctx.moveTo(ix,H*0.55);ctx.lineTo(ix+10,H*0.32);ctx.lineTo(ix+20,H*0.55);ctx.fill();ctx.fillStyle="rgba(180,220,255,.18)";ctx.beginPath();ctx.arc(ix+10,H*0.37,3,0,Math.PI*2);ctx.fill();ctx.fillStyle="#1a3550";}}else{ctx.fillStyle="#2a1848";for(var i=0;i<6;i++){var cx=((i*130+ox*0.18)%(W+140))-60,cy=H*0.5+((i*29)%30);ctx.beginPath();ctx.ellipse(cx,cy,34,8,0,0,Math.PI*2);ctx.fill();}ctx.strokeStyle="rgba(255,224,102,.18)";ctx.lineWidth=2;for(var i=0;i<3;i++){ctx.beginPath();ctx.arc(W*0.5,H*0.3,60+i*40+Math.sin(gT*0.3+i)*4,0,Math.PI*2);ctx.stroke();}}}

function drawPlayer(px,py){var invF=P.inv>0&&Math.floor(P.inv*9)%2===0;var isForm=P.form===1;var isCharge=P.chargeT>0;var bob=Math.sin(P.frame*1.1)*1;var legL=Math.sin(P.runT)*5;var legR=Math.sin(P.runT+Math.PI)*5;var armL=Math.sin(P.runT+Math.PI)*4;var armR=Math.sin(P.runT)*4;var lean=joy.x*2.5;var bodyC=invF?"#fff":(isForm?"#ffb020":"#e07030");var skinC=invF?"#fff":"#e8c8a0";var hairC=isForm?"#ffe866":"#1a1008";var pantsC=isForm?"#3a2a10":"#2a3a6a";
ctx.fillStyle="rgba(0,0,0,.3)";ctx.beginPath();ctx.ellipse(px,py+14,11,4.5,0,0,Math.PI*2);ctx.fill();
if(isForm||isCharge){var intensity=isCharge?0.5:1;for(var i=2;i>=0;i--){var r=(15+i*6+Math.sin(gT*8+i)*1.5)*intensity;ctx.globalAlpha=(0.1+i*0.06)*intensity;ctx.shadowBlur=14;ctx.shadowColor="#ffe040";ctx.fillStyle="#ffe040";ctx.beginPath();ctx.arc(px+lean,py+bob,r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;ctx.shadowBlur=0;}else{ctx.globalAlpha=0.16;ctx.shadowBlur=9;ctx.shadowColor="#3a9fff";ctx.fillStyle="#3a9fff";ctx.beginPath();ctx.arc(px+lean,py+bob,15+Math.sin(gT*4),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.shadowBlur=0;}
if(isCharge&&P.chargeT<0.25){ctx.globalAlpha=0.25*(P.chargeT/0.25);ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(px,py,32,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
ctx.fillStyle=pantsC;ctx.fillRect(px-7.5+legL*0.3+lean,py+2+bob,5,10);ctx.fillRect(px+2.5+legR*0.3+lean,py+2+bob,5,10);ctx.fillStyle=isForm?"#5a4010":"#1a1a2a";ctx.fillRect(px-8.5+legL*0.3+lean,py+11+bob,6,3);ctx.fillRect(px+2.5+legR*0.3+lean,py+11+bob,6,3);
var tx=px+lean;ctx.fillStyle=bodyC;ctx.shadowBlur=isForm?5:2;ctx.shadowColor=isForm?"#ffaa00":"#ff6020";ctx.beginPath();ctx.moveTo(tx-9,py-5+bob);ctx.lineTo(tx+9,py-5+bob);ctx.lineTo(tx+8,py+4+bob);ctx.lineTo(tx-8,py+4+bob);ctx.closePath();ctx.fill();ctx.shadowBlur=0;

ctx.fillStyle=skinC;ctx.beginPath();ctx.arc(tx,py-10+bob,7.2,0,Math.PI*2);ctx.fill();
ctx.fillStyle=hairC;if(isForm){var sway=Math.sin(gT*5)*1;var spikes=[[-7,-5+sway],[-4,-13],[-1,-17],[1,-19],[3,-17],[6,-13],[7.5,-5-sway],[2.5,-15],[-2.5,-16]];for(var i=0;i<spikes.length;i++){var sx=spikes[i][0],sy=spikes[i][1];ctx.beginPath();ctx.moveTo(tx+sx*0.3,py-10+bob+sy*0.2);ctx.lineTo(tx+sx,py-10+bob+sy);ctx.lineTo(tx+sx*0.5+(sx>0?1.8:-1.8),py-10+bob+sy*0.3);ctx.fill();}}else{var spikes=[[-6,-2],[-3.5,-7],[0,-9.5],[3.5,-7],[6,-2],[1.5,-10.5],[-1.5,-9.5]];for(var i=0;i<spikes.length;i++){var sx=spikes[i][0],sy=spikes[i][1];ctx.beginPath();ctx.moveTo(tx+sx*0.3,py-10+bob+sy*0.2);ctx.lineTo(tx+sx,py-10+bob+sy);ctx.lineTo(tx+sx*0.5+1.2,py-10+bob+sy*0.25);ctx.fill();}}
ctx.fillStyle=isForm?"#ff3020":"#111";ctx.beginPath();ctx.ellipse(tx-2.9,py-11+bob,1.8,1.2,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(tx+2.9,py-11+bob,1.8,1.2,0,0,Math.PI*2);ctx.fill();
if(P.orbit.on){var o=P.orbit,ocol=isForm?"#ffe040":"#ffcc44";for(var i=0;i<o.cnt;i++){var a=o.ang+(i/o.cnt)*Math.PI*2;var ox=px+Math.cos(a)*o.rad,oy=py+Math.sin(a)*o.rad;ctx.shadowBlur=7;ctx.shadowColor=ocol;ctx.fillStyle=ocol;ctx.beginPath();ctx.arc(ox,oy,5.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}}}

function drawEnemy(e,sx,sy){var flash=e.fl>0,bob=Math.sin(e.frame)*1;var legL=Math.sin(e.runT)*3.2,legR=Math.sin(e.runT+Math.PI)*3.2;var bodyC=flash?"#fff":e.c,skinC=flash?"#eee":"#d0b090";
ctx.fillStyle="rgba(0,0,0,.28)";ctx.beginPath();ctx.ellipse(sx,sy+e.r*0.6,e.r*0.7,e.r*0.2,0,0,Math.PI*2);ctx.fill();

ctx.fillStyle=bodyC;ctx.shadowBlur=flash?5:2;ctx.shadowColor=e.c;
if(e.type===3){ctx.beginPath();ctx.ellipse(sx,sy-1+bob,e.r*0.95,e.r*0.6,0,0,Math.PI*2);ctx.fill();}
else if(e.type===4){ctx.fillRect(sx-8,sy-8+bob,16,13);}
else if(e.type===5){ctx.beginPath();ctx.moveTo(sx,sy-9+bob);ctx.lineTo(sx+6,sy+bob);ctx.lineTo(sx,sy+7+bob);ctx.lineTo(sx-6,sy+bob);ctx.closePath();ctx.fill();}
else if(e.type===6){ctx.beginPath();ctx.moveTo(sx-9,sy-3+bob);ctx.lineTo(sx-5,sy-7+bob);ctx.lineTo(sx+5,sy-7+bob);ctx.lineTo(sx+9,sy-3+bob);ctx.lineTo(sx+9,sy+4+bob);ctx.lineTo(sx-9,sy+4+bob);ctx.closePath();ctx.fill();ctx.strokeStyle="rgba(200,255,220,.5)";ctx.lineWidth=1.5;ctx.stroke();}
else if(e.type===7){ctx.beginPath();ctx.arc(sx,sy-1+bob,7,0,Math.PI*2);ctx.fill();ctx.strokeStyle="rgba(10,40,30,.4)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sx-7,sy-1+bob);ctx.lineTo(sx+7,sy-1+bob);ctx.moveTo(sx,sy-8+bob);ctx.lineTo(sx,sy+6+bob);ctx.stroke();}
else{ctx.beginPath();ctx.moveTo(sx-7,sy-5+bob);ctx.lineTo(sx+7,sy-5+bob);ctx.lineTo(sx+6,sy+4+bob);ctx.lineTo(sx-6,sy+4+bob);ctx.closePath();ctx.fill();}
ctx.shadowBlur=0;
ctx.fillStyle=skinC;if(e.type===2){ctx.fillRect(sx-10,sy-6+bob,3,7);ctx.fillRect(sx+7,sy-12+bob,3,10);ctx.shadowBlur=5;ctx.shadowColor=e.c;ctx.fillStyle=e.c;ctx.beginPath();ctx.arc(sx+9,sy-14+bob,4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}else{ctx.fillRect(sx-10,sy-3+bob,3,7);ctx.fillRect(sx+7,sy-3+bob,3,7);}
ctx.fillStyle=skinC;ctx.beginPath();ctx.arc(sx,sy-10+bob,6,0,Math.PI*2);ctx.fill();ctx.fillStyle=flash?"#bbb":"#1a1520";if(e.type===4){ctx.beginPath();ctx.moveTo(sx-5,sy-12+bob);ctx.lineTo(sx,sy-18+bob);ctx.lineTo(sx+5,sy-12+bob);ctx.fill();}else{ctx.beginPath();ctx.arc(sx,sy-12+bob,5.5,Math.PI,0);ctx.fill();}
ctx.fillStyle="#111";ctx.beginPath();ctx.arc(sx-2.4,sy-11+bob,1.3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(sx+2.4,sy-11+bob,1.3,0,Math.PI*2);ctx.fill();
ctx.restore();
if(e.max>50){var pct=e.hp/e.max;var bw=e.boss?60:18;ctx.fillStyle="rgba(0,0,0,.45)";ctx.fillRect(sx-bw/2,sy-e.r-7,bw,2.5);ctx.fillStyle=pct>0.35?"#44ff88":"#ff4455";ctx.fillRect(sx-bw/2,sy-e.r-7,bw*pct,2.5);}
if(e.boss){ctx.textAlign="center";ctx.font="bold 11px system-ui";ctx.fillStyle="#ffe566";ctx.fillText(e.n,sx,sy-e.r-13);}}

function draw(){var sd=STAGES[Math.min(stage-1,STAGES.length-1)]||STAGES[0];ctx.fillStyle=sd.bg;ctx.fillRect(0,0,W,H);var shx=cam.sh?(Math.random()-0.5)*cam.sh*12:0,shy=cam.sh?(Math.random()-0.5)*cam.sh*12:0;var ox=-cam.x+W/2+shx,oy=-cam.y+H/2+shy;
