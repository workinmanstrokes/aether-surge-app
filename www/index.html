<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Surge Squad: Wild West Run</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fed7aa;
      font-family: 'Arial Black', Impact, sans-serif;
    }
    canvas#gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .top-bar {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      font-size: 16px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .badge {
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 20px;
      border: 2px solid #f59e0b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hint-overlay {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      color: #334155;
      font-size: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      letter-spacing: 1px;
      opacity: 0.85;
      animation: pulse 1.2s infinite alternate;
    }
    @keyframes pulse {
      from { transform: translateX(-50%) scale(0.95); opacity: 0.6; }
      to { transform: translateX(-50%) scale(1.05); opacity: 1; }
    }
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(5px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 100;
    }
    .card {
      background: #fff;
      border: 4px solid #38bdf8;
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      width: 85%;
      max-width: 320px;
      box-shadow: 0 16px 32px rgba(0,0,0,0.4);
    }
    .card h1 {
      font-size: 26px;
      color: #0284c7;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .card p {
      font-size: 16px;
      color: #475569;
      margin-bottom: 20px;
      font-family: sans-serif;
      font-weight: bold;
    }
    .btn {
      background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
      border: 2px solid #86efac;
      color: white;
      font-family: 'Arial Black', sans-serif;
      font-size: 20px;
      padding: 12px 28px;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(22, 163, 74, 0.5);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="ui">
    <div class="top-bar">
      <div class="badge" id="levelBadge">LEVEL 1</div>
      <div class="badge" style="border-color:#fbbf24;" id="coinBadge">🪙 0</div>
    </div>
    <div class="hint-overlay" id="hint">
      <span>⟵ DRAG TO MOVE ⟶</span>
    </div>
  </div>

  <div id="endModal" class="modal">
    <div class="card">
      <h1 id="endTitle">STAGE CLEAR!</h1>
      <p id="endDesc">You crushed the finish barrels!</p>
      <button class="btn" onclick="nextLevel()">CONTINUE</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game state
    let state = 'PLAYING'; // PLAYING, VICTORY, GAMEOVER
    let level = 1;
    let coins = 0;
    let trackProgress = 0; // World forward coordinate (moves upwards)
    const trackLength = 4800; // pixels to castle finish line
    const runSpeed = 190; // forward scroll speed

    // Squad configuration
    const squad = {
      x: 0, // lateral offset (-140 to 140)
      targetX: 0,
      count: 6, // number of cowboy gunners
      fireRate: 4.5, // bullets/sec per soldier
      fireRange: 420,
      shootTimer: 0,
      radius: 36
    };

    // Bullets, Obstacles, Gates, Pods, Barrels, Particles
    const bullets = [];
    const gates = [];
    const pods = [];
    const barrels = [];
    const particles = [];
    const floatingTexts = [];

    // Drag input
    let dragging = false;
    let dragStartX = 0;
    let squadStartX = 0;

    function onPointerDown(e) {
      dragging = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      dragStartX = clientX;
      squadStartX = squad.x;
      document.getElementById('hint').style.display = 'none';
    }
    function onPointerMove(e) {
      if (!dragging) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const dx = clientX - dragStartX;
      squad.x = Math.max(-130, Math.min(130, squadStartX + dx));
    }
    function onPointerUp() { dragging = false; }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);
    window.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    function initLevel() {
      state = 'PLAYING';
      trackProgress = 0;
      squad.x = 0;
      squad.count = 4;
      squad.fireRate = 4.0;
      bullets.length = 0;
      gates.length = 0;
      pods.length = 0;
      barrels.length = 0;
      particles.length = 0;
      floatingTexts.length = 0;
      document.getElementById('endModal').style.display = 'none';
      document.getElementById('levelBadge').innerText = `LEVEL ${level}`;
      document.getElementById('coinBadge').innerText = `🪙 ${coins}`;

      // Procedural track generation
      let y = 600;
      while (y < trackLength - 600) {
        const type = Math.random();
        if (type < 0.45) {
          // Gate Pair (left & right)
          const leftVal = Math.floor(Math.random() * 8) + 2;
          const rightBad = Math.random() < 0.4;
          const rightVal = rightBad ? -(Math.floor(Math.random() * 4) + 1) : Math.floor(Math.random() * 120) + 50;
          gates.push({
            y: y,
            left: { x: -65, text: `+${leftVal} GUNNERS`, val: leftVal, type: 'COUNT', hp: 20 },
            right: { x: 65, text: rightBad ? `${rightVal} RANGE` : `+${rightVal} RANGE`, val: rightVal, type: 'RANGE', hp: 35, isBad: rightBad },
            active: true
          });
          y += 500;
        } else if (type < 0.75) {
          // Recruitment Pod (glass dome)
          pods.push({
            x: (Math.random() - 0.5) * 160,
            y: y,
            hp: 25,
            maxHp: 25,
            bonus: 2 + Math.floor(Math.random() * 3),
            active: true
          });
          y += 420;
        } else {
          // Breakable Barrel blockade
          const rowCount = 3;
          for (let b = 0; b < rowCount; b++) {
            barrels.push({
              x: -80 + b * 80,
              y: y,
              hp: 30 + level * 5,
              maxHp: 30 + level * 5,
              coins: 15,
              active: true
            });
          }
          y += 450;
        }
      }

      // Final Victory Barrel Wall at trackLength
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          barrels.push({
            x: -90 + c * 60,
            y: trackLength + r * 65,
            hp: 60 + r * 30,
            maxHp: 60 + r * 30,
            coins: 25,
            isFinish: true,
            active: true
          });
        }
      }
    }

    function spawnExplosion(x, y, color = '#f59e0b', count = 10) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 40 + Math.random() * 140;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          color,
          life: 0.35,
          maxLife: 0.35,
          size: 4 + Math.random() * 5
        });
      }
    }

    function addFloatText(x, y, str, color = '#22c55e') {
      floatingTexts.push({ x, y, str, color, life: 0.6, maxLife: 0.6 });
    }

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (state === 'PLAYING') {
        update(dt);
      }
      render();
      requestAnimationFrame(loop);
    }

    function update(dt) {
      trackProgress += runSpeed * dt;

      // Shooting mechanics
      squad.shootTimer += dt;
      const interval = 1 / squad.fireRate;
      if (squad.shootTimer >= interval) {
        squad.shootTimer = 0;
        // Fire from front squad positions
        const numBullets = Math.min(squad.count, 6);
        for (let i = 0; i < numBullets; i++) {
          const spread = (i - (numBullets - 1) / 2) * 12;
          bullets.push({
            x: squad.x + spread,
            y: trackProgress + 40,
            vy: 650,
            dmg: 5,
            life: squad.fireRange / 650
          });
        }
      }

      // Update bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y += b.vy * dt;
        b.life -= dt;

        // Bullet hit Gates (increases gate bonus)
        for (let g of gates) {
          if (!g.active) continue;
          if (Math.abs(b.y - g.y) < 25) {
            if (b.x < 0 && Math.abs(b.x - g.left.x) < 55) {
              g.left.hp -= b.dmg;
              if (g.left.type === 'COUNT') g.left.val += 0.2;
              b.life = -1;
              break;
            } else if (b.x > 0 && Math.abs(b.x - g.right.x) < 55) {
              g.right.hp -= b.dmg;
              if (!g.right.isBad) g.right.val += 2;
              b.life = -1;
              break;
            }
          }
        }

        // Bullet hit Pods
        for (let p of pods) {
          if (!p.active) continue;
          if (Math.hypot(b.x - p.x, b.y - p.y) < 32) {
            p.hp -= b.dmg;
            spawnExplosion(p.x, p.y, '#38bdf8', 3);
            b.life = -1;
            if (p.hp <= 0) {
              p.active = false;
              squad.count += p.bonus;
              addFloatText(p.x, p.y, `+${p.bonus} GUNNERS!`, '#38bdf8');
              spawnExplosion(p.x, p.y, '#38bdf8', 18);
            }
            break;
          }
        }

        // Bullet hit Barrels
        for (let bar of barrels) {
          if (!bar.active) continue;
          if (Math.hypot(b.x - bar.x, b.y - bar.y) < 28) {
            bar.hp -= b.dmg;
            spawnExplosion(bar.x, bar.y, '#f59e0b', 3);
            b.life = -1;
            if (bar.hp <= 0) {
              bar.active = false;
              coins += bar.coins;
              document.getElementById('coinBadge').innerText = `🪙 ${coins}`;
              addFloatText(bar.x, bar.y, `+${bar.coins}🪙`, '#fbbf24');
              spawnExplosion(bar.x, bar.y, '#f59e0b', 14);
            }
            break;
          }
        }

        if (b.life <= 0) {
          bullets[i] = bullets[bullets.length - 1];
          bullets.pop();
        }
      }

      // Check Squad passing Gates
      for (let g of gates) {
        if (!g.active) continue;
        if (trackProgress >= g.y && trackProgress - runSpeed * dt < g.y) {
          g.active = false;
          const chosen = squad.x < 0 ? g.left : g.right;
          if (chosen.type === 'COUNT') {
            const add = Math.round(chosen.val);
            squad.count = Math.max(1, squad.count + add);
            addFloatText(squad.x, g.y, `+${add} SQUAD!`, '#22c55e');
          } else if (chosen.type === 'RANGE') {
            squad.fireRange = Math.max(200, squad.fireRange + chosen.val);
            addFloatText(squad.x, g.y, `RANGE BOOST!`, '#38bdf8');
          }
          spawnExplosion(chosen.x, g.y, '#22c55e', 20);
        }
      }

      // Check Squad collision with Barrels
      for (let bar of barrels) {
        if (!bar.active) continue;
        if (Math.hypot(squad.x - bar.x, trackProgress - bar.y) < 36) {
          bar.active = false;
          squad.count -= 2;
          spawnExplosion(bar.x, bar.y, '#ef4444', 16);
          if (squad.count <= 0) {
            gameOver();
            return;
          }
        }
      }

      // Particles update
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) {
          particles[i] = particles[particles.length - 1];
          particles.pop();
        }
      }

      // Floating text update
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const t = floatingTexts[i];
        t.y += 40 * dt;
        t.life -= dt;
        if (t.life <= 0) {
          floatingTexts[i] = floatingTexts[floatingTexts.length - 1];
          floatingTexts.pop();
        }
      }

      // Finish line check
      if (trackProgress > trackLength + 260) {
        victory();
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Camera centered behind the squad, tilted forward
      const cx = canvas.width / 2;
      const cy = canvas.height * 0.78;

      ctx.save();
      ctx.translate(cx, cy);

      // Draw stylized highway road
      const roadW = 320;
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(-roadW / 2, -cy, roadW, canvas.height);

      // Track borders (Canyon Cliff edges)
      ctx.fillStyle = '#d97706';
      ctx.fillRect(-roadW / 2 - 20, -cy, 20, canvas.height);
      ctx.fillRect(roadW / 2, -cy, 20, canvas.height);

      // Road chevron arrows
      const spacing = 180;
      const offset = -(trackProgress % spacing);
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (let y = -cy + offset - spacing; y < cy + spacing; y += spacing) {
        ctx.beginPath();
        ctx.moveTo(-45, y + 25);
        ctx.lineTo(0, y);
        ctx.lineTo(45, y + 25);
        ctx.stroke();
      }

      // World rendering transformation (moves down as trackProgress increases)
      ctx.save();
      ctx.scale(1, -1); // Flip Y so positive points forward/up
      ctx.translate(0, -trackProgress);

      // Draw Finish Arch Castle
      ctx.fillStyle = '#475569';
      ctx.fillRect(-150, trackLength - 20, 300, 40);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-120, trackLength + 20, 240, 60);

      // Draw Gates
      for (let g of gates) {
        if (!g.active) continue;
        drawGate(g.left, g.y, g.left.isBad ? '#ef4444' : '#22c55e');
        drawGate(g.right, g.y, g.right.isBad ? '#ef4444' : '#38bdf8');
      }

      // Draw Recruitment Pods
      for (let p of pods) {
        if (!p.active) continue;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 28, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Mini soldier inside
        ctx.fillStyle = '#fed7aa';
        ctx.beginPath();
        ctx.arc(0, 0, 10, 0, Math.PI * 2);
        ctx.fill();
        // Sombrero inside
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.ellipse(0, 4, 16, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Draw Barrels
      for (let bar of barrels) {
        if (!bar.active) continue;
        ctx.save();
        ctx.translate(bar.x, bar.y);
        ctx.fillStyle = bar.isFinish ? '#3b82f6' : '#854d0e';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(-22, -22, 44, 44, [8]);
        ctx.fill();
        ctx.stroke();

        // Health number
        ctx.save();
        ctx.scale(1, -1);
        ctx.fillStyle = '#fff';
        ctx.font = '16px Impact';
        ctx.textAlign = 'center';
        ctx.fillText(Math.ceil(bar.hp), 0, 6);
        ctx.restore();
        ctx.restore();
      }

      // Draw Bullets
      ctx.fillStyle = '#dc2626';
      for (let b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw Squad (Cowboys in Sombreros clustered together)
      drawCowboySquad();

      // Draw Particles
      for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw Floating Texts
      for (let t of floatingTexts) {
        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.scale(1, -1);
        ctx.fillStyle = t.color;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.font = '18px Impact';
        ctx.textAlign = 'center';
        ctx.strokeText(t.str, 0, 0);
        ctx.fillText(t.str, 0, 0);
        ctx.restore();
      }

      ctx.restore(); // Restore world scale
      ctx.restore(); // Restore screen camera
    }

    function drawGate(side, y, color) {
      ctx.save();
      ctx.translate(side.x, y);

      // Gate background plane
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.85;
      ctx.fillRect(-55, -8, 110, 16);
      ctx.globalAlpha = 1.0;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.strokeRect(-55, -8, 110, 16);

      // Gate Text
      ctx.save();
      ctx.scale(1, -1);
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 3;
      ctx.font = '14px Impact';
      ctx.textAlign = 'center';
      const displayText = side.type === 'COUNT' ? `+${Math.round(side.val)} GUNS` : `${side.val > 0 ? '+' : ''}${Math.round(side.val)} RANGE`;
      ctx.strokeText(displayText, 0, 5);
      ctx.fillText(displayText, 0, 5);
      ctx.restore();

      ctx.restore();
    }

    function drawCowboySquad() {
      ctx.save();
      ctx.translate(squad.x, trackProgress);

      const count = Math.max(1, squad.count);
      const rows = Math.ceil(Math.sqrt(count));
      const cols = Math.ceil(count / rows);

      // Render each member in cluster
      let drawn = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (drawn >= count) break;
          const ox = (c - (cols - 1) / 2) * 18;
          const oy = (r - (rows - 1) / 2) * 18;

          // Shadow
          ctx.fillStyle = 'rgba(0,0,0,0.3)';
          ctx.beginPath();
          ctx.ellipse(ox, oy, 12, 6, 0, 0, Math.PI * 2);
          ctx.fill();

          // Sombrero Hat (Yellow/Gold)
          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.ellipse(ox, oy + 2, 14, 8, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#78350f';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Hat Crown
          ctx.fillStyle = '#d97706';
          ctx.beginPath();
          ctx.arc(ox, oy + 4, 6, 0, Math.PI * 2);
          ctx.fill();

          drawn++;
        }
      }

      // Squad Count badge above head
      ctx.save();
      ctx.scale(1, -1);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-20, 24, 40, 20);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.strokeRect(-20, 24, 40, 20);
      ctx.fillStyle = '#fff';
      ctx.font = '14px Impact';
      ctx.textAlign = 'center';
      ctx.fillText(Math.round(squad.count), 0, 39);
      ctx.restore();

      ctx.restore();
    }

    function victory() {
      state = 'VICTORY';
      document.getElementById('endTitle').innerText = 'VICTORY!';
      document.getElementById('endTitle').style.color = '#16a34a';
      document.getElementById('endDesc').innerText = `Loot collected: 🪙 ${coins}`;
      document.getElementById('endModal').style.display = 'flex';
    }

    function gameOver() {
      state = 'GAMEOVER';
      document.getElementById('endTitle').innerText = 'DEFEATED';
      document.getElementById('endTitle').style.color = '#dc2626';
      document.getElementById('endDesc').innerText = 'Your squad was eliminated!';
      document.getElementById('endModal').style.display = 'flex';
    }

    function nextLevel() {
      if (state === 'VICTORY') level++;
      initLevel();
    }

    initLevel();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
