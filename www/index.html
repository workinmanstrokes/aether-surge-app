<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Brainrot 2025: Aura Rush</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
      font-family: 'Arial Black', Impact, sans-serif;
    }
    canvas#gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .top-bar {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      font-size: 15px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }
    .badge {
      background: rgba(15, 23, 42, 0.92);
      padding: 8px 16px;
      border-radius: 20px;
      border: 2px solid #38bdf8;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tier-announcement {
      position: absolute;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      color: #facc15;
      font-size: 18px;
      text-shadow: 0 3px 0 #854d0e, 0 0 14px rgba(250, 204, 21, 0.7);
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .hint-overlay {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      color: #94a3b8;
      font-size: 16px;
      letter-spacing: 1px;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: translateX(-50%) scale(0.95); opacity: 0.5; }
      to { transform: translateX(-50%) scale(1.05); opacity: 1; }
    }
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 100;
    }
    .card {
      background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%);
      border: 4px solid #38bdf8;
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      width: 85%;
      max-width: 320px;
      box-shadow: 0 16px 40px rgba(56, 189, 248, 0.3);
    }
    .card h1 {
      font-size: 26px;
      color: #38bdf8;
      margin-bottom: 12px;
      text-transform: uppercase;
      text-shadow: 0 3px 0 #0369a1;
    }
    .card p {
      font-size: 16px;
      color: #cbd5e1;
      margin-bottom: 20px;
      font-family: sans-serif;
      font-weight: bold;
    }
    .btn {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      border: 2px solid #bae6fd;
      color: #0f172a;
      font-family: 'Arial Black', sans-serif;
      font-size: 18px;
      padding: 12px 28px;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.5);
    }
    .btn:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="ui">
    <div class="top-bar">
      <div class="badge" id="levelBadge">ZONE 1</div>
      <div class="badge" style="border-color:#facc15;" id="auraBadge">✨ +0 AURA</div>
    </div>
    <div class="tier-announcement" id="tierBadge">TIER 1: CHICKEN JOCKEY</div>
    <div class="hint-overlay" id="hint">⟵ DRAG TO FARM AURA ⟶</div>
  </div>

  <div id="endModal" class="modal">
    <div class="card">
      <h1 id="endTitle">INFINITE AURA!</h1>
      <p id="endDesc">You survived the crash out!</p>
      <button class="btn" onclick="nextLevel()">CONTINUE</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let state = 'PLAYING';
    let level = 1;
    let aura = 0;
    let trackProgress = 0;
    const trackLength = 4800;
    const runSpeed = 210;

    const squad = {
      x: 0,
      count: 4,
      fireRate: 4.5,
      fireRange: 460,
      shootTimer: 0,
      tier: 0
    };

    // 2024-2025 Brainrot Roster
    const TIERS = [
      { minCount: 1, name: "TIER 1: CHICKEN JOCKEY", bulletColor: "#facc15", fireMult: 1.0 },
      { minCount: 10, name: "TIER 2: BOMBADILLO CROCODILLO", bulletColor: "#22c55e", fireMult: 1.4 },
      { minCount: 25, name: "TIER 3: CLANKER PROTOCOL", bulletColor: "#ef4444", fireMult: 1.9 },
      { minCount: 50, name: "TIER 4: BIG BACK CRASH OUT", bulletColor: "#ec4899", fireMult: 2.6 },
      { minCount: 100, name: "TIER 5: 100 MEN VS 1 GORILLA", bulletColor: "#38bdf8", fireMult: 3.6 }
    ];

    const bullets = [];
    const gates = [];
    const pods = [];
    const barrels = [];
    const particles = [];
    const floatingTexts = [];

    let dragging = false;
    let dragStartX = 0;
    let squadStartX = 0;

    function onPointerDown(e) {
      dragging = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      dragStartX = clientX;
      squadStartX = squad.x;
      document.getElementById('hint').style.display = 'none';
    }
    function onPointerMove(e) {
      if (!dragging) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const dx = clientX - dragStartX;
      squad.x = Math.max(-135, Math.min(135, squadStartX + dx));
    }
    function onPointerUp() { dragging = false; }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);
    window.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    function getTier(count) {
      for (let i = TIERS.length - 1; i >= 0; i--) {
        if (count >= TIERS[i].minCount) return i;
      }
      return 0;
    }

    function initLevel() {
      state = 'PLAYING';
      trackProgress = 0;
      squad.x = 0;
      squad.count = 4;
      bullets.length = 0;
      gates.length = 0;
      pods.length = 0;
      barrels.length = 0;
      particles.length = 0;
      floatingTexts.length = 0;
      document.getElementById('endModal').style.display = 'none';
      document.getElementById('levelBadge').innerText = `ZONE ${level}`;
      document.getElementById('auraBadge').innerText = `✨ ${aura >= 0 ? '+' : ''}${aura} AURA`;

      let y = 600;
      while (y < trackLength - 600) {
        const type = Math.random();
        if (type < 0.45) {
          const leftVal = Math.floor(Math.random() * 8) + 3;
          const rightBad = Math.random() < 0.35;
          const rightVal = rightBad ? -(Math.floor(Math.random() * 400) + 100) : (Math.floor(Math.random() * 600) + 200);
          gates.push({
            y: y,
            left: { x: -65, text: `+${leftVal} UNCS`, val: leftVal, type: 'COUNT', hp: 20 },
            right: { x: 65, text: rightBad ? `${rightVal} AURA` : `+${rightVal} AURA`, val: rightVal, type: 'AURA', hp: 30, isBad: rightBad },
            active: true
          });
          y += 520;
        } else if (type < 0.75) {
          pods.push({
            x: (Math.random() - 0.5) * 160,
            y: y,
            hp: 28,
            bonus: 3 + Math.floor(Math.random() * 4),
            active: true
          });
          y += 440;
        } else {
          for (let b = 0; b < 3; b++) {
            barrels.push({
              x: -80 + b * 80,
              y: y,
              hp: 35 + level * 8,
              maxHp: 35 + level * 8,
              aura: 150,
              active: true
            });
          }
          y += 460;
        }
      }

      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          barrels.push({
            x: -90 + c * 60,
            y: trackLength + r * 65,
            hp: 60 + r * 35,
            maxHp: 60 + r * 35,
            aura: 500,
            isFinish: true,
            active: true
          });
        }
      }
    }

    function drawVoxel(ctx, x, y, z, w, h, d, hexColor) {
      const isoX = x;
      const isoY = y - z;

      ctx.fillStyle = hexColor;
      ctx.beginPath();
      ctx.moveTo(isoX, isoY - h);
      ctx.lineTo(isoX + w / 2, isoY - h - d / 3);
      ctx.lineTo(isoX, isoY - h - (2 * d) / 3);
      ctx.lineTo(isoX - w / 2, isoY - h - d / 3);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = adjustBrightness(hexColor, -25);
      ctx.beginPath();
      ctx.moveTo(isoX, isoY - h);
      ctx.lineTo(isoX + w / 2, isoY - h - d / 3);
      ctx.lineTo(isoX + w / 2, isoY - d / 3);
      ctx.lineTo(isoX, isoY);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = adjustBrightness(hexColor, -45);
      ctx.beginPath();
      ctx.moveTo(isoX, isoY - h);
      ctx.lineTo(isoX - w / 2, isoY - h - d / 3);
      ctx.lineTo(isoX - w / 2, isoY - d / 3);
      ctx.lineTo(isoX, isoY);
      ctx.closePath();
      ctx.fill();
    }

    function adjustBrightness(hex, percent) {
      let num = parseInt(hex.replace("#",""), 16),
      amt = Math.round(2.55 * percent),
      R = (num >> 16) + amt,
      G = (num >> 8 & 0x00FF) + amt,
      B = (num & 0x0000FF) + amt;
      return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (G<255?G<1?0:G:255)*0x100 + (B<255?B<1?0:B:255)).toString(16).slice(1);
    }

    function spawnExplosion(x, y, color = '#38bdf8', count = 12) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 40 + Math.random() * 160;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          color,
          life: 0.35,
          size: 4 + Math.random() * 6
        });
      }
    }

    function addFloatText(x, y, str, color = '#38bdf8') {
      floatingTexts.push({ x, y, str, color, life: 0.65 });
    }

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (state === 'PLAYING') {
        update(dt);
      }
      render();
      requestAnimationFrame(loop);
    }

    function update(dt) {
      trackProgress += runSpeed * dt;

      const tierIndex = getTier(squad.count);
      squad.tier = tierIndex;
      const tInfo = TIERS[tierIndex];
      document.getElementById('tierBadge').innerText = tInfo.name;

      squad.shootTimer += dt;
      const interval = 1 / (squad.fireRate * tInfo.fireMult);
      if (squad.shootTimer >= interval) {
        squad.shootTimer = 0;
        const numBullets = Math.min(squad.count, 7);
        for (let i = 0; i < numBullets; i++) {
          const spread = (i - (numBullets - 1) / 2) * 14;
          bullets.push({
            x: squad.x + spread,
            y: trackProgress + 45,
            vy: 740,
            dmg: 5 + tierIndex * 3,
            color: tInfo.bulletColor,
            life: squad.fireRange / 740
          });
        }
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y += b.vy * dt;
        b.life -= dt;

        for (let g of gates) {
          if (!g.active) continue;
          if (Math.abs(b.y - g.y) < 25) {
            if (b.x < 0 && Math.abs(b.x - g.left.x) < 55) {
              if (g.left.type === 'COUNT') g.left.val += 0.25;
              b.life = -1;
              break;
            } else if (b.x > 0 && Math.abs(b.x - g.right.x) < 55) {
              if (!g.right.isBad) g.right.val += 15;
              b.life = -1;
              break;
            }
          }
        }

        for (let p of pods) {
          if (!p.active) continue;
          if (Math.hypot(b.x - p.x, b.y - p.y) < 32) {
            p.hp -= b.dmg;
            spawnExplosion(p.x, p.y, '#38bdf8', 3);
            b.life = -1;
            if (p.hp <= 0) {
              p.active = false;
              squad.count += p.bonus;
              addFloatText(p.x, p.y, `+${p.bonus} CLIPPED!`, '#38bdf8');
              spawnExplosion(p.x, p.y, '#38bdf8', 20);
            }
            break;
          }
        }

        for (let bar of barrels) {
          if (!bar.active) continue;
          if (Math.hypot(b.x - bar.x, b.y - bar.y) < 28) {
            bar.hp -= b.dmg;
            spawnExplosion(bar.x, bar.y, '#f59e0b', 3);
            b.life = -1;
            if (bar.hp <= 0) {
              bar.active = false;
              aura += bar.aura;
              document.getElementById('auraBadge').innerText = `✨ ${aura >= 0 ? '+' : ''}${aura} AURA`;
              addFloatText(bar.x, bar.y, `+${bar.aura} AURA`, '#facc15');
              spawnExplosion(bar.x, bar.y, '#f59e0b', 14);
            }
            break;
          }
        }

        if (b.life <= 0) {
          bullets[i] = bullets[bullets.length - 1];
          bullets.pop();
        }
      }

      for (let g of gates) {
        if (!g.active) continue;
        if (trackProgress >= g.y && trackProgress - runSpeed * dt < g.y) {
          g.active = false;
          const chosen = squad.x < 0 ? g.left : g.right;
          if (chosen.type === 'COUNT') {
            const add = Math.round(chosen.val);
            squad.count = Math.max(1, squad.count + add);
            addFloatText(squad.x, g.y, `+${add} SQUAD!`, '#22c55e');
          } else {
            aura += Math.round(chosen.val);
            document.getElementById('auraBadge').innerText = `✨ ${aura >= 0 ? '+' : ''}${aura} AURA`;
            addFloatText(squad.x, g.y, `${chosen.val > 0 ? '+' : ''}${chosen.val} AURA!`, chosen.val > 0 ? '#38bdf8' : '#ef4444');
          }
          spawnExplosion(chosen.x, g.y, '#38bdf8', 22);
        }
      }

      for (let bar of barrels) {
        if (!bar.active) continue;
        if (Math.hypot(squad.x - bar.x, trackProgress - bar.y) < 38) {
          bar.active = false;
          squad.count -= 3;
          aura -= 250;
          document.getElementById('auraBadge').innerText = `✨ ${aura >= 0 ? '+' : ''}${aura} AURA`;
          spawnExplosion(bar.x, bar.y, '#ef4444', 16);
          if (squad.count <= 0) {
            gameOver();
            return;
          }
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) {
          particles[i] = particles[particles.length - 1];
          particles.pop();
        }
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const t = floatingTexts[i];
        t.y += 45 * dt;
        t.life -= dt;
        if (t.life <= 0) {
          floatingTexts[i] = floatingTexts[floatingTexts.length - 1];
          floatingTexts.pop();
        }
      }

      if (trackProgress > trackLength + 260) {
        victory();
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height * 0.78;

      ctx.save();
      ctx.translate(cx, cy);

      const roadW = 320;
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-roadW / 2, -cy, roadW, canvas.height);

      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(-roadW / 2 - 8, -cy, 8, canvas.height);
      ctx.fillRect(roadW / 2, -cy, 8, canvas.height);

      const spacing = 160;
      const offset = -(trackProgress % spacing);
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 4;
      for (let y = -cy + offset - spacing; y < cy + spacing; y += spacing) {
        ctx.beginPath();
        ctx.moveTo(-roadW / 2, y);
        ctx.lineTo(roadW / 2, y);
        ctx.stroke();
      }

      ctx.save();
      ctx.scale(1, -1);
      ctx.translate(0, -trackProgress);

      for (let g of gates) {
        if (!g.active) continue;
        drawVoxelGate(g.left, g.y, g.left.isBad ? '#ef4444' : '#22c55e');
        drawVoxelGate(g.right, g.y, g.right.isBad ? '#ef4444' : '#38bdf8');
      }

      for (let p of pods) {
        if (!p.active) continue;
        drawVoxel(ctx, p.x, p.y, 0, 36, 36, 36, '#0284c7');
        drawVoxel(ctx, p.x, p.y, 36, 24, 24, 24, '#38bdf8');
      }

      for (let bar of barrels) {
        if (!bar.active) continue;
        const color = bar.isFinish ? '#ec4899' : '#f59e0b';
        drawVoxel(ctx, bar.x, bar.y, 0, 34, 34, 34, color);

        ctx.save();
        ctx.scale(1, -1);
        ctx.fillStyle = '#fff';
        ctx.font = '16px Impact';
        ctx.textAlign = 'center';
        ctx.fillText(Math.ceil(bar.hp), bar.x, -bar.y - 12);
        ctx.restore();
      }

      for (let b of bullets) {
        drawVoxel(ctx, b.x, b.y, 10, 8, 8, 8, b.color || '#38bdf8');
      }

      draw2025BrainrotSquad();

      for (let p of particles) {
        drawVoxel(ctx, p.x, p.y, 5, p.size, p.size, p.size, p.color);
      }

      for (let t of floatingTexts) {
        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.scale(1, -1);
        ctx.fillStyle = t.color;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.font = '18px Impact';
        ctx.textAlign = 'center';
        ctx.strokeText(t.str, 0, 0);
        ctx.fillText(t.str, 0, 0);
        ctx.restore();
      }

      ctx.restore();
      ctx.restore();
    }

    function drawVoxelGate(side, y, color) {
      ctx.save();
      ctx.translate(side.x, y);

      drawVoxel(ctx, 0, 0, 0, 95, 12, 12, color);

      ctx.save();
      ctx.scale(1, -1);
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 3;
      ctx.font = '13px Impact';
      ctx.textAlign = 'center';
      const displayText = side.type === 'COUNT' ? `+${Math.round(side.val)} UNCS` : `${side.val > 0 ? '+' : ''}${Math.round(side.val)} AURA`;
      ctx.strokeText(displayText, 0, 6);
      ctx.fillText(displayText, 0, 6);
      ctx.restore();

      ctx.restore();
    }

    function draw2025BrainrotSquad() {
      ctx.save();
      ctx.translate(squad.x, trackProgress);

      const count = Math.max(1, squad.count);
      const rows = Math.ceil(Math.sqrt(count));
      const cols = Math.ceil(count / rows);
      const tier = squad.tier;

      let drawn = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (drawn >= count) break;
          const ox = (c - (cols - 1) / 2) * 20;
          const oy = (r - (rows - 1) / 2) * 20;

          const bob = Math.sin((trackProgress * 0.1) + drawn) * 3;

          if (tier === 0) {
            // Tier 1: Chicken Jockey (White block chicken + tiny jockey)
            drawVoxel(ctx, ox, oy, 0 + bob, 14, 14, 12, '#f8fafc');
            drawVoxel(ctx, ox, oy, 12 + bob, 8, 8, 8, '#ef4444'); // Jockey
            drawVoxel(ctx, ox, oy + 6, 4 + bob, 4, 4, 4, '#f59e0b'); // Beak
          } else if (tier === 1) {
            // Tier 2: Bombadillo Crocodillo (Crocodile Airplane)
            drawVoxel(ctx, ox, oy, 0 + bob, 22, 12, 10, '#15803d'); // Green body
            drawVoxel(ctx, ox, oy, 6 + bob, 8, 20, 4, '#64748b'); // Plane wings
            drawVoxel(ctx, ox, oy + 8, 4 + bob, 8, 8, 6, '#166534'); // Croc snout
          } else if (tier === 2) {
            // Tier 3: Clanker (Mechanical Droid)
            drawVoxel(ctx, ox, oy, 0 + bob, 14, 12, 16, '#94a3b8'); // Metal torso
            drawVoxel(ctx, ox, oy, 16 + bob, 10, 10, 8, '#cbd5e1'); // Droid head
            drawVoxel(ctx, ox, oy, 18 + bob, 6, 2, 2, '#ef4444'); // Red visor light
          } else if (tier === 3) {
            // Tier 4: Big Back Crash Out (Massive purple brute)
            drawVoxel(ctx, ox, oy, 0 + bob, 24, 18, 20, '#d97706'); // Huge burger body
            drawVoxel(ctx, ox, oy, 20 + bob, 16, 14, 12, '#ef4444'); // Red enraged head
          } else {
            // Tier 5: 100 Men vs 1 Gorilla (Ascended Golden Gorilla King)
            drawVoxel(ctx, ox, oy, 0 + bob, 24, 20, 22, '#1e293b'); // Gorilla bulk
            drawVoxel(ctx, ox, oy, 22 + bob, 16, 16, 16, '#facc15'); // Golden aura crest
          }

          drawn++;
        }
      }

      ctx.save();
      ctx.scale(1, -1);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-24, 28, 48, 20);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.strokeRect(-24, 28, 48, 20);
      ctx.fillStyle = '#fff';
      ctx.font = '14px Impact';
      ctx.textAlign = 'center';
      ctx.fillText(Math.round(squad.count), 0, 43);
      ctx.restore();

      ctx.restore();
    }

    function victory() {
      state = 'VICTORY';
      document.getElementById('endTitle').innerText = 'CRASH OUT AVOIDED!';
      document.getElementById('endDesc').innerText = `Total Aura: ✨ ${aura >= 0 ? '+' : ''}${aura}`;
      document.getElementById('endModal').style.display = 'flex';
    }

    function gameOver() {
      state = 'GAMEOVER';
      document.getElementById('endTitle').innerText = 'CHOPPED!';
      document.getElementById('endTitle').style.color = '#ef4444';
      document.getElementById('endDesc').innerText = 'You lost all your aura and crashed out!';
      document.getElementById('endModal').style.display = 'flex';
    }

    function nextLevel() {
      if (state === 'VICTORY') level++;
      initLevel();
    }

    initLevel();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
