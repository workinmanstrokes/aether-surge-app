<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Brainrot: Tactical Aura Rush</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: 'Arial Black', Impact, sans-serif; transition: background 2s ease; }
    canvas#gameCanvas { display: block; width: 100vw; height: 100vh; }
    
    #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
    
    .top-bar { position: absolute; top: env(safe-area-inset-top, 16px); left: 16px; right: 16px; display: flex; flex-direction: column; gap: 12px; }
    .stats-row { display: flex; justify-content: space-between; align-items: center; color: #fff; font-size: 15px; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
    .badge { background: rgba(15, 23, 42, 0.92); padding: 8px 16px; border-radius: 20px; border: 2px solid #38bdf8; box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4); display: flex; align-items: center; gap: 6px; }
    
    .progress-container { width: 100%; height: 14px; background: rgba(15,23,42,0.9); border: 2px solid #334155; border-radius: 8px; overflow: hidden; position: relative; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #facc15, #ec4899); box-shadow: 0 0 10px #facc15; transition: width 0.1s linear; }
    
    .tier-announcement { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); color: #38bdf8; font-size: 18px; text-shadow: 0 3px 0 #0369a1, 0 0 14px rgba(56, 189, 248, 0.7); text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; transition: transform 0.2s; }
    .tier-pop { transform: translateX(-50%) scale(1.3) !important; color: #fff !important; text-shadow: 0 0 20px #facc15 !important; }

    .modal { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 100; }
    .card { background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%); border: 4px solid #38bdf8; border-radius: 24px; padding: 30px 24px; text-align: center; width: 85%; max-width: 340px; box-shadow: 0 16px 50px rgba(56, 189, 248, 0.3); animation: slideUp 0.4s ease-out; }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    
    .card h1 { font-size: 30px; color: #38bdf8; margin-bottom: 12px; text-transform: uppercase; text-shadow: 0 4px 0 #0369a1; }
    .card p { font-size: 16px; color: #cbd5e1; margin-bottom: 24px; font-family: sans-serif; font-weight: bold; line-height: 1.4; }
    
    .btn { background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%); border: 2px solid #bae6fd; color: #0f172a; font-family: 'Arial Black', sans-serif; font-size: 20px; padding: 16px 32px; border-radius: 16px; cursor: pointer; box-shadow: 0 8px 20px rgba(56, 189, 248, 0.5); text-transform: uppercase; letter-spacing: 1px; width: 100%; transition: transform 0.1s; }
    .btn:active { transform: scale(0.95); }
    
    #hint { position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); color: #fff; font-size: 18px; letter-spacing: 2px; animation: pulse 1s infinite alternate; text-shadow: 0 2px 4px #000; }
    
    #bossUI { position: absolute; top: 130px; left: 50%; transform: translateX(-50%); width: 80%; display: none; flex-direction: column; align-items: center; gap: 8px; }
    #bossUI span { color: #ef4444; font-size: 18px; text-shadow: 0 2px 4px #000; letter-spacing: 2px; }
    .boss-hp-container { width: 100%; height: 16px; background: rgba(0,0,0,0.8); border: 2px solid #7f1d1d; border-radius: 8px; overflow: hidden; }
    .boss-hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ef4444, #dc2626); transition: width 0.1s; }
    
    /* Post-Processing Screen Effects */
    #damageOverlay { position: absolute; inset: 0; background: radial-gradient(circle, transparent 40%, rgba(239,68,68,0.4) 100%); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    #slowmoOverlay { position: absolute; inset: 0; box-shadow: inset 0 0 100px rgba(56,189,248,0.3); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  </style>
</head>
<body>
  <div id="damageOverlay"></div>
  <div id="slowmoOverlay"></div>
  <canvas id="gameCanvas"></canvas>

  <div id="ui">
    <div class="top-bar">
      <div class="progress-container"><div class="progress-fill" id="progressBar"></div></div>
      <div class="stats-row">
        <div class="badge" id="levelBadge">ZONE 1</div>
        <div class="badge" style="border-color:#facc15;" id="auraBadge">✨ 0 AURA</div>
      </div>
    </div>
    
    <div id="bossUI">
      <span>GORILLA KING</span>
      <div class="boss-hp-container"><div class="boss-hp-fill" id="bossHpBar"></div></div>
    </div>

    <div class="tier-announcement" id="tierBadge">FORMATION: WIDE SQUAD</div>
    <div id="hint">⟵ DRAG TO STEER ⟶</div>
  </div>

  <div id="startModal" class="modal">
    <div class="card">
      <h1 style="color:#facc15; text-shadow:0 4px 0 #a16207; border-color:#facc15;">TACTICAL RUSH</h1>
      <p>Choose Formations to adapt.<br>Dodge telegraphed Boss lasers.<br>Last Stand slow-mo will save you!</p>
      <button class="btn" style="background: linear-gradient(180deg, #facc15 0%, #ca8a04 100%); border-color:#fef08a;" onclick="startGame()">TAP TO START</button>
    </div>
  </div>

  <div id="endModal" class="modal" style="display:none;">
    <div class="card">
      <h1 id="endTitle">STAGE CLEAR!</h1>
      <p id="endDesc">Boss Defeated!</p>
      <button class="btn" id="nextBtn" onclick="nextLevel()">CONTINUE</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Audio Engine
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx;
    function initAudio() {
      if (!actx) actx = new AudioContext();
      if (actx.state === 'suspended') actx.resume();
    }
    function playSound(type) {
      if (!actx) return;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain); gain.connect(actx.destination);
      const now = actx.currentTime;

      if (type === 'shoot') {
        osc.type = 'square'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
        gain.gain.setValueAtTime(0.02, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
      } else if (type === 'hit') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
        gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'powerup') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.setValueAtTime(1200, now + 0.2);
        gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
      } else if (type === 'laser') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.linearRampToValueAtTime(50, now + 0.8);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);
      } else if (type === 'damage') {
        osc.type = 'square'; osc.frequency.setValueAtTime(120, now); osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      }
    }

    // Game State
    let state = 'START';
    let level = 1, aura = 0, trackProgress = 0, trackLength = 6000, baseSpeed = 240, screenShake = 0;
    let timeScale = 1.0; 
    let slowMoTimer = 0;
    let zoneColor = '#0f172a'; // Starts Blue-ish

    const squad = { 
      x: 0, targetX: 0, 
      count: 4, visualCount: 4, // For streaming growth animation
      formation: 'GRID', // GRID, WIDE, SPEARHEAD, SHIELD
      fireRate: 4.5, fireRange: 550, shootTimer: 0 
    };

    const entities = { bullets: [], gates: [], enemies: [], particles: [], texts: [] };
    let boss = null;

    let dragging = false, dragStartX = 0, squadStartX = 0;

    function onPointerDown(e) {
      if (state !== 'PLAYING' && state !== 'BOSS') return;
      dragging = true; dragStartX = e.touches ? e.touches[0].clientX : e.clientX;
      squadStartX = squad.targetX; document.getElementById('hint').style.display = 'none';
    }
    function onPointerMove(e) {
      if (!dragging) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const dx = (clientX - dragStartX) * 1.6;
      squad.targetX = Math.max(-150, Math.min(150, squadStartX + dx));
    }
    function onPointerUp() { dragging = false; }
    window.addEventListener('mousedown', onPointerDown); window.addEventListener('mousemove', onPointerMove); window.addEventListener('mouseup', onPointerUp);
    window.addEventListener('touchstart', onPointerDown, { passive: true }); window.addEventListener('touchmove', onPointerMove, { passive: true }); window.addEventListener('touchend', onPointerUp);

    function startGame() { initAudio(); document.getElementById('startModal').style.display = 'none'; document.getElementById('ui').style.display = 'block'; initLevel(); }

    function generateGateAction(isBad) {
      if (isBad) {
        return Math.random() > 0.5 ? { text: `-10 SQUAD`, type: 'SQUAD', val: -10 } : { text: `-250 AURA`, type: 'AURA', val: -250 };
      } else {
        const types = ['SQUAD', 'FORM_WIDE', 'FORM_SPEAR', 'AURA'];
        const type = types[Math.floor(Math.random() * types.length)];
        if (type === 'SQUAD') return { text: `+${Math.floor(Math.random()*15)+5} SQUAD`, type: 'SQUAD', val: Math.floor(Math.random()*15)+5 };
        if (type === 'FORM_WIDE') return { text: `WIDE FORMATION`, type: 'FORM', val: 'WIDE' };
        if (type === 'FORM_SPEAR') return { text: `SPEARHEAD`, type: 'FORM', val: 'SPEARHEAD' };
        return { text: `+500 AURA`, type: 'AURA', val: 500 };
      }
    }

    function initLevel() {
      state = 'PLAYING'; trackProgress = 0; trackLength = 5000 + (level * 1000); baseSpeed = 240 + (level * 10);
      squad.x = 0; squad.targetX = 0; squad.count = 4; squad.visualCount = 4; squad.formation = 'GRID';
      timeScale = 1.0; slowMoTimer = 0;
      for(let key in entities) entities[key].length = 0;
      boss = null; document.getElementById('bossUI').style.display = 'none'; document.getElementById('endModal').style.display = 'none';
      document.getElementById('levelBadge').innerText = `ZONE ${level}`; 
      document.getElementById('tierBadge').innerText = `FORMATION: GRID`;
      updateAuraUI();

      let y = 600;
      while (y < trackLength - 600) {
        if (Math.random() < 0.45) {
          const isRightBad = Math.random() < 0.4;
          entities.gates.push({
            y: y,
            left: { x: -75, ...generateGateAction(false), hp: 20 },
            right: { x: 75, ...generateGateAction(isRightBad), hp: 20, isBad: isRightBad },
            active: true
          });
          y += 600;
        } else {
          const type = Math.random() < 0.5 ? 'SWARM' : 'TANK';
          for (let b = 0; b < (type === 'SWARM' ? 4 : 2); b++) {
            entities.enemies.push({
              x: type === 'SWARM' ? -120 + b * 80 : -70 + b * 140, y: y,
              hp: type === 'SWARM' ? 20 + level * 5 : 80 + level * 20, 
              maxHp: type === 'SWARM' ? 20 + level * 5 : 80 + level * 20,
              type: type, aura: type === 'SWARM' ? 50 : 150, active: true, hitTime: 0
            });
          }
          y += 500;
        }
      }
    }

    function spawnBoss() {
      state = 'BOSS'; 
      boss = { 
        x: 0, y: trackProgress + 600, 
        hp: 2000 + (level * 800), maxHp: 2000 + (level * 800), 
        state: 'IDLE', timer: 0, hitTime: 0, active: true,
        targetX: 0
      };
      document.getElementById('bossUI').style.display = 'flex';
      baseSpeed = 80; // Slow down track for arena feel
    }

    function updateAuraUI() {
      const b = document.getElementById('auraBadge');
      b.innerText = `✨ ${Math.round(aura)} AURA`;
      b.style.color = aura < 0 ? '#ef4444' : '#fff'; b.style.borderColor = aura < 0 ? '#ef4444' : '#facc15';
    }

    function spawnExplosion(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2; const spd = 80 + Math.random() * 250;
        entities.particles.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, color, life: 0.5, size: 6 + Math.random() * 8 });
      }
    }
    function addFloatText(x, y, str, color) { entities.texts.push({ x, y, str, color, life: 0.8, vy: 70 }); }

    function triggerLastStand() {
      if (slowMoTimer <= 0) {
        slowMoTimer = 2.0; // 2 seconds of slow-mo
        playSound('powerup');
        addFloatText(squad.x, trackProgress + 100, "LAST STAND!", "#38bdf8");
      }
    }

    let lastTime = performance.now();
    function loop(now) {
      let rawDt = Math.min((now - lastTime) / 1000, 0.05); lastTime = now;
      
      // Last Stand Slow-Mo Logic
      if (slowMoTimer > 0) {
        slowMoTimer -= rawDt;
        timeScale = 0.35; // 35% speed
        document.getElementById('slowmoOverlay').style.opacity = '1';
      } else {
        timeScale = 1.0;
        document.getElementById('slowmoOverlay').style.opacity = '0';
      }
      
      const dt = rawDt * timeScale; // Apply timescale to game logic

      if (state === 'PLAYING' || state === 'BOSS') update(dt, rawDt);
      render(); requestAnimationFrame(loop);
    }

    function update(dt, rawDt) {
      trackProgress += baseSpeed * dt;
      
      // Dynamic Atmospheres (Blue -> Orange -> Purple)
      const pct = trackProgress / trackLength;
      if (state === 'BOSS') zoneColor = '#3b0764'; // Deep Purple Boss Arena
      else if (pct < 0.4) zoneColor = '#0f172a'; // Training Blue
      else if (pct < 0.8) zoneColor = '#431407'; // Industrial Orange
      else zoneColor = '#3b0764';
      document.body.style.backgroundColor = zoneColor;

      if (state === 'PLAYING') {
        document.getElementById('progressBar').style.width = `${Math.min(100, (trackProgress / trackLength) * 100)}%`;
        if (trackProgress > trackLength) spawnBoss();
      }

      squad.x += (squad.targetX - squad.x) * 12 * dt;
      
      // Visual Squad Growth (Streaming in)
      if (squad.visualCount < squad.count) {
        squad.visualCount += (squad.count - squad.visualCount) * 4 * dt;
        if (squad.count - squad.visualCount < 0.5) squad.visualCount = squad.count;
      } else if (squad.visualCount > squad.count) {
        squad.visualCount = squad.count; // Snap down on damage
      }

      // Shooting logic
      squad.shootTimer += dt;
      const activeCount = Math.floor(squad.visualCount);
      if (squad.shootTimer >= (1 / squad.fireRate) && activeCount > 0) {
        squad.shootTimer = 0; playSound('shoot');
        // Width of fire depends on formation
        const numBullets = Math.min(activeCount, squad.formation === 'WIDE' ? 12 : (squad.formation === 'SPEARHEAD' ? 5 : 8));
        const spreadMultiplier = squad.formation === 'WIDE' ? 22 : (squad.formation === 'SPEARHEAD' ? 8 : 14);
        
        for (let i = 0; i < numBullets; i++) {
          const spread = (i - (numBullets - 1) / 2) * spreadMultiplier;
          entities.bullets.push({
            x: squad.x + spread, y: trackProgress + 45, vy: 900, dmg: 10 + (level * 2), color: '#38bdf8', life: squad.fireRange / 900
          });
        }
      }

      // Boss Logic: Readable Attack Patterns
      if (state === 'BOSS' && boss.active) {
        boss.y = trackProgress + 450;
        boss.timer -= dt;

        if (boss.state === 'IDLE') {
          boss.x += (0 - boss.x) * 2 * dt; // Center up
          if (boss.timer <= 0) {
            boss.state = 'TELEGRAPH'; boss.timer = 1.5; // 1.5s warning
            boss.targetX = squad.x; // Lock onto player's current position
            playSound('powerup'); // Warning sound
          }
        } else if (boss.state === 'TELEGRAPH') {
          // Draw warning handled in render
          if (boss.timer <= 0) {
            boss.state = 'STRIKE'; boss.timer = 0.8; // 0.8s laser duration
            playSound('laser');
            triggerShake(15);
          }
        } else if (boss.state === 'STRIKE') {
          // Continuous laser damage if player in zone
          if (Math.abs(squad.x - boss.targetX) < 60) {
            squad.count -= 10 * dt;
            if (squad.count <= 3 && slowMoTimer <= 0) triggerLastStand();
            document.getElementById('damageOverlay').style.opacity = '1';
            setTimeout(() => document.getElementById('damageOverlay').style.opacity = '0', 100);
            if (squad.count <= 0) { gameOver(); return; }
          }
          if (boss.timer <= 0) {
            boss.state = 'IDLE'; boss.timer = 2.0; // Cooldown
          }
        }

        document.getElementById('bossHpBar').style.width = `${Math.max(0, (boss.hp / boss.maxHp) * 100)}%`;
      }

      // Update Enemies
      for (let e of entities.enemies) {
        if (!e.active) continue;
        if (e.type === 'SWARM') {
          e.y -= 80 * dt; // Fast movement
          // Swarm sweeps side to side
          e.x += Math.sin(trackProgress * 0.01 + e.y) * 120 * dt; 
        } else {
          e.y -= 30 * dt; // Tank slow
        }
        
        if (Math.hypot(squad.x - e.x, trackProgress - e.y) < 45) {
          e.active = false; squad.count -= (e.type === 'TANK' ? 8 : 2);
          screenShake = 15; playSound('damage'); spawnExplosion(e.x, e.y, '#ef4444', 25);
          if (squad.count <= 3 && slowMoTimer <= 0) triggerLastStand();
          if (squad.count <= 0) { gameOver(); return; }
        }
      }

      // Update Bullets
      for (let i = entities.bullets.length - 1; i >= 0; i--) {
        const b = entities.bullets[i]; b.y += b.vy * dt; b.life -= dt; let hit = false;
        
        for (let g of entities.gates) {
          if (!g.active || hit) continue;
          if (Math.abs(b.y - g.y) < 25) {
            if (b.x < 0 && Math.abs(b.x - g.left.x) < 70) { if (g.left.type === 'SQUAD' && !g.left.isBad) g.left.val += 0.2; g.left.hitTime = 0.1; hit = true; }
            else if (b.x > 0 && Math.abs(b.x - g.right.x) < 70) { if (g.right.type === 'SQUAD' && !g.right.isBad) g.right.val += 0.2; g.right.hitTime = 0.1; hit = true; }
          }
        }
        
        for (let e of entities.enemies) {
          if (!e.active || hit) continue;
          if (Math.hypot(b.x - e.x, b.y - e.y) < 40) {
            e.hp -= b.dmg; e.hitTime = 0.1; hit = true; spawnExplosion(b.x, b.y, '#38bdf8', 2);
            if (e.hp <= 0) { 
              e.active = false; aura += e.aura; updateAuraUI(); playSound('hit'); 
              addFloatText(e.x, e.y, `+${e.aura}`, '#facc15'); spawnExplosion(e.x, e.y, '#facc15', 16); 
            }
          }
        }

        if (state === 'BOSS' && boss.active && !hit) {
          if (Math.hypot(b.x - boss.x, b.y - boss.y) < 80) {
            boss.hp -= b.dmg; boss.hitTime = 0.1; hit = true; spawnExplosion(b.x, b.y, '#38bdf8', 3);
            if (boss.hp <= 0) { boss.active = false; aura += 5000; updateAuraUI(); playSound('powerup'); spawnExplosion(boss.x, boss.y, '#facc15', 60); victory(); }
          }
        }
        if (hit || b.life <= 0) { entities.bullets[i] = entities.bullets[entities.bullets.length - 1]; entities.bullets.pop(); }
      }

      // Check Gate pass
      for (let g of entities.gates) {
        if (!g.active) continue;
        if (trackProgress >= g.y && trackProgress - baseSpeed * dt < g.y) {
          g.active = false; const chosen = squad.x < 0 ? g.left : g.right;
          if (chosen.type === 'SQUAD') { squad.count = Math.max(1, squad.count + Math.round(chosen.val)); }
          else if (chosen.type === 'FORM') { 
            squad.formation = chosen.val; 
            const badgeUI = document.getElementById('tierBadge');
            badgeUI.innerText = `FORMATION: ${chosen.val}`;
            badgeUI.classList.add('tier-pop'); setTimeout(() => badgeUI.classList.remove('tier-pop'), 200);
          }
          else if (chosen.type === 'AURA') { aura += chosen.val; updateAuraUI(); }
          
          playSound('powerup'); addFloatText(squad.x, g.y, chosen.text, chosen.isBad ? '#ef4444' : '#38bdf8');
          spawnExplosion(chosen.x, g.y, chosen.isBad ? '#ef4444' : '#38bdf8', 30);
        }
      }

      // Particles
      for (let i = entities.particles.length - 1; i >= 0; i--) {
        const p = entities.particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.95; p.vy *= 0.95; p.life -= dt;
        if (p.life <= 0) { entities.particles[i] = entities.particles[entities.particles.length - 1]; entities.particles.pop(); }
      }
      for (let i = entities.texts.length - 1; i >= 0; i--) {
        const t = entities.texts[i]; t.y += t.vy * dt; t.life -= dt;
        if (t.life <= 0) { entities.texts[i] = entities.texts[entities.texts.length - 1]; entities.texts.pop(); }
      }
      
      // Shake decay
      if (screenShake > 0) screenShake -= rawDt * 40; if (screenShake < 0) screenShake = 0;
    }

    // ----- 3D VOXEL RENDERING ENGINE -----
    // Increased base size significantly for better readability
    function drawVoxel(ctx, x, y, z, w, h, d, hexColor) {
      const isoX = x; const isoY = y - z;
      ctx.fillStyle = hexColor; ctx.beginPath(); ctx.moveTo(isoX, isoY - h); ctx.lineTo(isoX + w/2, isoY - h - d/3); ctx.lineTo(isoX, isoY - h - (2*d)/3); ctx.lineTo(isoX - w/2, isoY - h - d/3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = adjustBrightness(hexColor, -25); ctx.beginPath(); ctx.moveTo(isoX, isoY - h); ctx.lineTo(isoX + w/2, isoY - h - d/3); ctx.lineTo(isoX + w/2, isoY - d/3); ctx.lineTo(isoX, isoY); ctx.closePath(); ctx.fill();
      ctx.fillStyle = adjustBrightness(hexColor, -45); ctx.beginPath(); ctx.moveTo(isoX, isoY - h); ctx.lineTo(isoX - w/2, isoY - h - d/3); ctx.lineTo(isoX - w/2, isoY - d/3); ctx.lineTo(isoX, isoY); ctx.closePath(); ctx.fill();
    }
    function adjustBrightness(hex, percent) {
      let num = parseInt(hex.replace("#",""), 16), amt = Math.round(2.55 * percent);
      let R = (num >> 16) + amt, G = (num >> 8 & 0x00FF) + amt, B = (num & 0x0000FF) + amt;
      return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (G<255?G<1?0:G:255)*0x100 + (B<255?B<1?0:B:255)).toString(16).slice(1);
    }
    function drawShadow(ctx, x, y, radius) { ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.ellipse(x, y - radius*0.2, radius, radius*0.3, 0, 0, Math.PI*2); ctx.fill(); }

    function drawGate(side, y, color, isHit) {
      ctx.save(); ctx.translate(side.x, y);
      ctx.fillStyle = isHit ? '#ffffff' : color; ctx.globalAlpha = isHit ? 0.9 : 0.3; ctx.fillRect(-85, -5, 170, 10);
      ctx.globalAlpha = 1.0; ctx.strokeStyle = isHit ? '#ffffff' : color; ctx.lineWidth = 4; ctx.strokeRect(-85, -5, 170, 10);
      ctx.save(); ctx.scale(1, -1); ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#000000'; ctx.lineWidth = 4; ctx.font = '900 16px Arial Black'; ctx.textAlign = 'center';
      let text = side.text; if (side.type === 'SQUAD' && !side.isBad) text = `+${Math.round(side.val)} SQUAD`;
      ctx.strokeText(text, 0, 18); ctx.fillText(text, 0, 18);
      ctx.restore(); ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height); // Background handled by body CSS
      const cx = canvas.width / 2, cy = canvas.height * 0.82;

      ctx.save();
      if (screenShake > 0) ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
      ctx.translate(cx, cy);

      // Track rendering
      const roadW = 380;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.4)'; ctx.fillRect(-roadW / 2, -cy, roadW, canvas.height);
      ctx.fillStyle = '#38bdf8'; ctx.fillRect(-roadW / 2 - 8, -cy, 8, canvas.height); ctx.fillRect(roadW / 2, -cy, 8, canvas.height);

      const spacing = 180, offset = -(trackProgress % spacing);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)'; ctx.lineWidth = 4;
      for (let y = -cy + offset - spacing; y < cy + spacing; y += spacing) {
        ctx.beginPath(); ctx.moveTo(-roadW / 2, y); ctx.lineTo(roadW / 2, y); ctx.stroke();
      }

      ctx.save(); ctx.scale(1, -1); ctx.translate(0, -trackProgress);

      // Boss Telegraph/Attack Marker
      if (state === 'BOSS' && boss && boss.active) {
        if (boss.state === 'TELEGRAPH' || boss.state === 'STRIKE') {
          ctx.fillStyle = boss.state === 'TELEGRAPH' ? 'rgba(239, 68, 68, 0.3)' : 'rgba(239, 68, 68, 0.8)';
          ctx.fillRect(boss.targetX - 60, trackProgress - 200, 120, boss.y - trackProgress + 200);
        }
      }

      for (let g of entities.gates) {
        if (!g.active) continue;
        drawGate(g.left, g.y, g.left.isBad ? '#ef4444' : '#22c55e', g.left.hitTime > 0);
        drawGate(g.right, g.y, g.right.isBad ? '#ef4444' : '#38bdf8', g.right.hitTime > 0);
      }

      // Enemies (Larger Voxel scaling)
      for (let e of entities.enemies) {
        if (!e.active) continue;
        if (e.hitTime > 0) e.hitTime -= 0.016;
        drawShadow(ctx, e.x, e.y, 45);
        if (e.type === 'SWARM') {
          // Agile Swarm Bot
          drawVoxel(ctx, e.x, e.y, 0, 20, 24, 20, e.hitTime > 0 ? '#ffffff' : '#64748b'); 
          drawVoxel(ctx, e.x, e.y+4, 18, 12, 6, 12, '#38bdf8'); // Cyan Core
        } else {
          // Heavy Tank Bot
          drawVoxel(ctx, e.x, e.y, 0, 32, 28, 32, e.hitTime > 0 ? '#ffffff' : '#b45309'); 
          drawVoxel(ctx, e.x, e.y, 28, 16, 16, 16, '#ea580c'); // Orange Head
        }
        // HP Bar
        ctx.save(); ctx.translate(e.x, e.y); ctx.scale(1, -1);
        ctx.fillStyle = '#000'; ctx.fillRect(-20, -40, 40, 6);
        ctx.fillStyle = '#ef4444'; ctx.fillRect(-20, -40, 40 * (e.hp/e.maxHp), 6);
        ctx.restore();
      }

      // Boss
      if (state === 'BOSS' && boss && boss.active) {
        if (boss.hitTime > 0) boss.hitTime -= 0.016;
        drawShadow(ctx, boss.x, boss.y, 100);
        // Boss is massive
        drawVoxel(ctx, boss.x, boss.y, 0, 80, 60, 60, boss.hitTime > 0 ? '#ffffff' : '#1e293b'); // Armor
        drawVoxel(ctx, boss.x, boss.y, 60, 50, 45, 40, boss.hitTime > 0 ? '#ffffff' : '#eab308'); // Golden Head
        // Glowing red eyes when attacking
        const eyeColor = (boss.state === 'TELEGRAPH' || boss.state === 'STRIKE') ? '#ef4444' : '#000000';
        drawVoxel(ctx, boss.x-15, boss.y+15, 80, 10, 10, 10, eyeColor); 
        drawVoxel(ctx, boss.x+15, boss.y+15, 80, 10, 10, 10, eyeColor); 
      }

      // Bullets (Cyan glowing laser lines)
      ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.strokeStyle = '#38bdf8';
      for (let b of entities.bullets) {
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x, b.y - 20); ctx.stroke();
      }

      // Draw Squad with Streaming Expansion and Outlines
      ctx.save(); ctx.translate(squad.x, trackProgress);
      
      const count = Math.ceil(squad.visualCount); // Use interpolated count
      drawShadow(ctx, 0, 0, 50 + Math.min(count*2, 60));

      // Calculate Formation Positions
      for (let i = 0; i < count; i++) {
        let ox = 0, oy = 0;
        if (squad.formation === 'WIDE') {
          const cols = Math.min(12, count);
          const r = Math.floor(i / cols); const c = i % cols;
          ox = (c - (Math.min(count, cols) - 1) / 2) * 24;
          oy = r * -24; // Stack backwards
        } else if (squad.formation === 'SPEARHEAD') {
          const row = Math.floor(Math.sqrt(i));
          const col = i - (row * row);
          ox = (col - (row) / 2) * 26;
          oy = row * -26;
        } else { // GRID
          const cols = Math.ceil(Math.sqrt(count));
          const r = Math.floor(i / cols); const c = i % cols;
          ox = (c - (Math.min(count, cols) - 1) / 2) * 24;
          oy = r * -24;
        }

        const bob = Math.abs(Math.sin((trackProgress * 0.15) + i)) * 6;

        // Player Voxel (White/Cyan uniform style for readability)
        drawVoxel(ctx, ox, oy, bob, 14, 18, 14, '#e2e8f0'); // Body
        drawVoxel(ctx, ox, oy, 18+bob, 12, 12, 12, '#38bdf8'); // Head / Helmet
      }

      // Visual Counter
      ctx.save(); ctx.scale(1, -1);
      ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.roundRect(-30, 45, 60, 24, 12); ctx.fill();
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = '900 14px Arial Black'; ctx.textAlign = 'center'; ctx.fillText(`x${Math.round(squad.count)}`, 0, 62);
      ctx.restore();
      ctx.restore();

      for (let p of entities.particles) { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); }
      for (let t of entities.texts) {
        ctx.save(); ctx.translate(t.x, t.y); ctx.scale(1, -1);
        ctx.fillStyle = t.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
        ctx.font = '900 22px Arial Black'; ctx.textAlign = 'center'; ctx.strokeText(t.str, 0, 0); ctx.fillText(t.str, 0, 0);
        ctx.restore();
      }

      ctx.restore(); ctx.restore();
    }

    function victory() { state = 'VICTORY'; document.getElementById('endTitle').innerText = 'STAGE CLEAR!'; document.getElementById('endTitle').style.color = '#38bdf8'; document.getElementById('endDesc').innerText = `Aura Acquired: ✨ ${Math.round(aura)}`; document.getElementById('nextBtn').innerText = "NEXT ZONE"; document.getElementById('endModal').style.display = 'flex'; }
    function gameOver() { state = 'GAMEOVER'; document.getElementById('endTitle').innerText = 'CRASHED OUT!'; document.getElementById('endTitle').style.color = '#ef4444'; document.getElementById('endDesc').innerText = 'Your squad was wiped out!'; document.getElementById('nextBtn').innerText = "RETRY"; document.getElementById('endModal').style.display = 'flex'; }
    function nextLevel() { if (state === 'VICTORY') level++; initLevel(); }
    
    requestAnimationFrame(loop);
  </script>
</body>
</html>
